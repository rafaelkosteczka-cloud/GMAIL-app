/* ── Attack / Combo System ── */
function pushCombo(key) {
  comboBuffer.push(key);
  comboTimer = 54; // janela para encadear o proximo golpe
  if(comboBuffer.length > 6) comboBuffer.shift();
  
  var seq = comboBuffer.join('');
  if(seq.endsWith('ZZ')) {
    comboText = '1-2!';
    comboTextTimer = 32;
  }
  if(seq.endsWith('ZZX')) {
    comboText = 'SOCO SOCO CHUTE!';
    comboTextTimer = 44;
  }
  if(seq.endsWith('ZZXC')) {
    if(pKi>=20) {
       pSpec=true; pSpecF=0; pSpecHit=false;
       pKi -= 20;
       comboBuffer = [];
       attackChain = 0;
       triggerCutin('KAMEHAMEHA','#38bdf8','hero');
       comboText = 'COMBO ESPECIAL!';
       comboTextTimer = 64;
       return true;
    }
    comboText = 'KI BAIXO!';
    comboTextTimer = 42;
  }
  if((seq.endsWith('DOWNRIGHTC') || key === 'C') && pKi>=50) {
     pSpec=true; pSpecF=0; pSpecHit=false;
     pKi -= 50;
     comboBuffer = [];
     attackChain = 0;
     triggerCutin('KAMEHAMEHA','#38bdf8','hero');
     comboText = 'ESPECIAL!';
     comboTextTimer = 54;
     return true;
  }
  return false;
}

function triggerSpecialCombo(name, dmg) {
  comboText = name; comboTextTimer = 60;
  comboBuffer = [];
  pState = 'kick'; pAtk=true; pAtkF=0;
  flashA=.4; flashC='#f97316';
  // auto-hit boss
  bHP=Math.max(0,bHP-dmg);bFlash=15;bShake=2.5;
  burst(BOSS_X, BOSS_Y+40, '#f97316', true);
  lbl(BOSS_X-40, BOSS_Y-20, '-'+dmg, '#f97316', 20);
  checkPhase();
  if(bHP<=0){setTimeout(triggerWin,200);}
  else{maybeTriggerMinionPhase(200);}
}

function getAttackPose(baseType, frame) {
  if (frame <= 4)  return baseType + '_start';
  if (frame <= 13) return baseType + '_active';
  // cross and kick have no dedicated recover — reuse start (limb pulling back)
  if (baseType === 'cross' || baseType === 'kick') return baseType + '_start';
  return baseType + '_recover';
}

function attack(keyType){
  if(gs==='intro'){gs='rising';introF=0;return;}
  if(gs==='win'||gs==='lose'){reset();return;}
  if(gs!=='fight')return;
  if(pAtk||pSpec)return;
  
  var isSpecial = pushCombo(keyType || 'Z');
  if(isSpecial) return;
  if(keyType === 'C'){
    lbl(charX-35,charY-105,'SEM KI','#93c5fd',12);
    return;
  }

  pAtk=true;pAtkF=0;
  var chainSlot = attackChain % 4;
  if(keyType === 'X') {
    pAttackBase = 'kick';
  } else if(keyType === 'C') {
    pAttackBase = 'special';
  } else {
    pAttackBase = chainSlot % 2 === 0 ? 'jab' : 'cross';
  }
  pState = 'idle';
  attackChain++;
  lastAttack = keyType;

  // Enche o KI com ataques!
  pKi = Math.min(100, pKi + 8);
  
  var prevSt=pStage;
  // Transforma com base no KI e não no número de hits do combo
  pStage = pKi >= 90 ? 3 : pKi >= 60 ? 2 : pKi >= 30 ? 1 : 0;
  
  if (pStage !== prevSt) {
    updateHeroSprites(); // Cabelo muda de cor ao vivo!
    flashA=Math.max(flashA,.52+pStage*.08);
    flashC=pStage>=3?'#93c5fd':'#fde047';
    lbl(charX-55,charY-108,pStage>=3?'⚡ SUPER SAIYAJIN BLUE!':'✨ SUPER SAIYAJIN!',flashC,pStage>=3?18:16);
    burst(charX,charY-40,flashC,true);
    triggerCutin(pStage>=3?'ULTRA INSTINTO':'TRANSFORMACAO',flashC,'hero');
  }
  
  if(gamePhase===1||bossKneel){
    var bestI=-1,bestD=9999;
    emailWave.forEach(function(e,i){
      if(!e.alive)return;
      var d=Math.hypot(e.x-charX,e.y-charY);
      if(d<bestD){bestD=d;bestI=i;}
    });
    if(bestI>=0){pAtkTargetX=emailWave[bestI].x;pAtkTargetY=emailWave[bestI].y;}
    else{pAtkTargetX=BOSS_X;pAtkTargetY=BOSS_Y+77;}
  } else {
    pAtkTargetX=BOSS_X;pAtkTargetY=BOSS_Y+77;
  }
  
  // NOVA FÍSICA: Ao atacar, o personagem teleporta para o alvo e FICA lá!
  // O px (posição física base) avança permanentemente para a direção do ataque.
  px = clamp(pAtkTargetX - 90, 80, W-80);
}

/* ── Boss shoot ── */
function bossShoot(){
  var ph=BPHASES[bPhase];
  bossIntentT=30;
  if(bPhase>=2&&cutinT<=0&&Math.random()<.45)triggerCutin('OLHOS NO INBOX',ph.bord,'boss');
  var bvx=BOSS_X+bossOffsetX(),bvy=BOSS_Y+90+Math.sin(bBobT)*8;
  var cnt=bPhase>=2?5:bPhase>=1?3:1;
  var baseA=Math.atan2(charY-bvy,charX-bvx);
  var spread=bPhase>=2?.22:.3;
  for(var i=0;i<cnt;i++){
    var a=cnt===1?baseA:baseA+(i-(cnt-1)/2)*spread;
    var spd=bPhase>=3?8:bPhase>=2?6:4.5;
    var s=SENDERS[Math.floor(Math.random()*SENDERS.length)];
    projs.push({x:bvx-90,y:bvy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,s:s,fl:0});
  }
}

function checkPhase(){
  var np=bPhase;
  if(bHP<=100&&bPhase<3)np=3;
  else if(bHP<=200&&bPhase<2)np=2;
  else if(bHP<=400&&bPhase<1)np=1;
  if(np!==bPhase){
    bPhase=np;bAtkT=Math.min(bAtkT,50);
    burst(BOSS_X,BOSS_Y+77,BPHASES[np].bord,true);
    lbl(BOSS_X-55,BOSS_Y-10,'FASE '+(np+1)+'!',BPHASES[np].bord,16);
  }
}

  if(bossKneel||bossAfterKneel||bHP<=0)return;

function drawAura(hx,hy,st){
  if(st===0)return;
  var col=st>=3?'147,197,253':st>=2?'245,158,11':'251,191,36';
  var c1=st>=3?'rgba(147,197,253,':st>=2?'rgba(245,158,11,':'rgba(251,191,36,';
  
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  
  // Flaming Aura (Multiple paths moving dynamically)
  for(var i=0; i<3; i++) {
     var t = aT*3 + i*2;
     var w = 60 + (st*15) + Math.sin(t)*15;
     var h = 120 + (st*25) + Math.cos(t*1.3)*20;
     
     var g = ctx.createRadialGradient(hx, hy+30, 10, hx, hy-20, w);
     g.addColorStop(0, c1+'0.8)');
     g.addColorStop(0.4, c1+'0.4)');
     g.addColorStop(1, c1+'0)');
     
     ctx.fillStyle = g;
     ctx.beginPath();
     // Desenhar chama que envolve o corpo!
     ctx.moveTo(hx, hy+50);
     ctx.quadraticCurveTo(hx-w, hy+20, hx-w*0.5, hy-h + Math.sin(t)*20);
     ctx.quadraticCurveTo(hx, hy-h-30, hx+w*0.5, hy-h + Math.cos(t)*20);
     ctx.quadraticCurveTo(hx+w, hy+20, hx, hy+50);
     ctx.fill();
  }
  
  // Lightning sparks for SSJ2 and SSJ3
  if(st>=2){
    ctx.strokeStyle=st>=3?'rgba(255,255,255,0.9)':'rgba(59,130,246,0.8)';
    ctx.lineWidth=2.5;
    for(var k=0;k<3;k++){
      if(Math.sin(aT*12+k)<0)continue; // Flicker/Strobe effect
      var sx = hx + (Math.random()-0.5)*110;
      var sy = hy - 40 + (Math.random()-0.5)*140;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx+(Math.random()-0.5)*40, sy+(Math.random()-0.5)*40);
      ctx.lineTo(sx+(Math.random()-0.5)*50, sy+(Math.random()-0.5)*50);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSpritePlaceholder(img, x, y, w, h, label, color) {
  if (img && img.complete && img.naturalWidth !== 0) {
     ctx.drawImage(img, x-w/2, y-h, w, h);
     return;
  }
  // Fallback Placeholder if user hasn't downloaded PNGs yet
  ctx.fillStyle = color || '#333';
  if(ctx.roundRect) ctx.roundRect(x-w/2, y-h, w, h, 8); else ctx.rect(x-w/2, y-h, w, h);
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign='center';
  ctx.fillText(label, x, y-h/2);
}

function drawChar(hx,fy,atk,st,inv){
  if(inv>0&&Math.floor(inv/4)%2===0)return;
  var hy=fy-68;
  
  // Sombra
  var sd=Math.max(0,fy-FLOOR);
  ctx.save();ctx.globalAlpha=lerp(.35,.08,sd/60);
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(hx,FLOOR+6,lerp(28,16,sd/60),5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  
  drawAura(hx,hy,st);
  
  // Decide which sprite to show
  var sprite = ASSETS.hero_idle;
  var label = "[HERO IDLE]";

  if(pSpec && pSpecF < 32) {
      sprite = ASSETS.hero_special_charge; label = "[HERO CHARGE]";
  } else if(pSpec && pSpecF >= 32) {
      sprite = ASSETS.hero_special_fire; label = "[HERO KAMEHA]";
  } else if(atk) {
      var vPose = getAttackPose(pAttackBase, pAtkF);
      var sprKey = 'hero_' + vPose;
      sprite = ASSETS[sprKey] || ASSETS.hero_idle;
      label = '[HERO ' + vPose.toUpperCase() + ']';
  } else if(gs === 'win') {
      sprite = ASSETS.hero_win; label = "[HERO WIN]";
  }

  // Draw the actual PNG or Placeholder
  drawSpritePlaceholder(sprite, hx, fy, 160, 250, label, '#f97316');
  
  // Combo Text UI Floating
  if(comboTextTimer > 0) {
      ctx.save(); ctx.globalAlpha = Math.min(1, comboTextTimer/20);
      ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#fde047';
      ctx.shadowColor = '#b45309'; ctx.shadowBlur = 10;
      ctx.textAlign = 'center';
      ctx.fillText(comboText, hx, fy-180 - (60-comboTextTimer)*0.5);
      ctx.restore();
  }
}

/* ── Kamehameha Auto-Aim ── */
function drawKameha(){
  if(!pSpec)return;
  pSpecF++;
  
  // Calcula o ângulo na direção do inimigo mais próximo (pAtkTargetX, pAtkTargetY)
  var tx = pAtkTargetX, ty = pAtkTargetY;
  var dist = Math.hypot(tx - charX, ty - (charY-35));
  var angle = Math.atan2(ty - (charY-35), tx - charX);
  
  if(pSpecF<32){
    var cr=(pSpecF/32)*40;
    var cg=ctx.createRadialGradient(charX,charY-35,0,charX,charY-35,cr);
    cg.addColorStop(0,'rgba(147,197,253,.95)');cg.addColorStop(1,'rgba(147,197,253,0)');
    ctx.beginPath();ctx.arc(charX,charY-35,cr,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
    return;
  }
  var beamLen = (pSpecF-32)*18;
  if(beamLen > dist) beamLen = dist + 20; // Ultrapassa o inimigo um pouco
  
  ctx.save();
  ctx.translate(charX, charY-35);
  ctx.rotate(angle);
  
  var bH=28+Math.sin(pSpecF*.25)*8;
  var bg=ctx.createLinearGradient(0,0,beamLen,0);
  bg.addColorStop(0,'rgba(147,197,253,.98)');bg.addColorStop(.4,'rgba(100,210,255,.9)');bg.addColorStop(1,'rgba(147,197,253,0)');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.rect(0,-bH/2,beamLen,bH);ctx.fill();
  
  var core=ctx.createLinearGradient(0,0,beamLen,0);
  core.addColorStop(0,'rgba(255,255,255,.9)');core.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=core;
  ctx.beginPath();ctx.rect(0,-bH*.3,beamLen,bH*.6);ctx.fill();
  
  var tg=ctx.createRadialGradient(beamLen,0,0,beamLen,0,42);
  tg.addColorStop(0,'rgba(220,245,255,.95)');tg.addColorStop(1,'rgba(147,197,253,0)');
  ctx.beginPath();ctx.arc(beamLen,0,42,0,Math.PI*2);ctx.fillStyle=tg;ctx.fill();
  ctx.restore();
  
  if(!pSpecHit && beamLen >= dist){
    pSpecHit=true;
    if(gamePhase===2 && !bossKneel && Math.hypot(tx-BOSS_X, ty-(BOSS_Y+77)) < 50){
      bHP=Math.max(0,bHP-120);bFlash=18;bShake=1.8;
      burst(BOSS_X,BOSS_Y+77,'#93c5fd',true);
      lbl(BOSS_X-40,BOSS_Y-14,'-120!','#93c5fd',18);
      checkPhase();
      if(bHP<=0){setTimeout(triggerWin,200);}
      else{maybeTriggerMinionPhase(200);}
    } else {
      var cleared=0;
      emailWave.forEach(function(e){
        if(e.alive && Math.hypot(e.x - tx, e.y - ty) < 90){
          e.alive=false;
          if(bossKneel)kneelKilled++;else waveKilled++;
          cleared++;
          burst(e.x,e.y,'#93c5fd',false);
        }
      });
      if(cleared>0)lbl(tx,ty-30,cleared>1?cleared+'x DELETADO!':'DELETADO!','#93c5fd',14);
    }
  }
  if(pSpecF>90){pSpec=false;pSpecF=0;pSpecHit=false;syncLbl();}
}

  ctx.font='bold 10px monospace';ctx.fillStyle='rgba(255,255,255,.6)';ctx.textAlign='left';

    var ph=BPHASES[bPhase],bx=112,by=H-36,bw=W-224,bh=14;
    var bf=clamp(bHP/BOSS_MAX_HP,0,1);
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,.78)';
    ctx.strokeStyle='rgba(248,250,252,.12)';
    ctx.lineWidth=1;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx-10,by-21,bw+20,43,8);else ctx.rect(bx-10,by-21,bw+20,43);ctx.fill();ctx.stroke();
    ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.fillStyle=ph.bord;
    ctx.fillText('BOSS '+ph.lbl+' '+ph.cnt,bx,by-7);
    ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.58)';
    ctx.fillText(Math.ceil(bf*100)+'%',bx+bw,by-7);
    ctx.fillStyle='rgba(255,255,255,.1)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,bw,bh,5);else ctx.rect(bx,by,bw,bh);ctx.fill();
    var gg=ctx.createLinearGradient(bx,by,bx+bw,by);
    gg.addColorStop(0,'#22c55e');gg.addColorStop(.7,'#facc15');gg.addColorStop(1,ph.bord);
    ctx.fillStyle=gg;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,bw*bf,bh,5);else ctx.rect(bx,by,bw*bf,bh);ctx.fill();
    var mx=bx+bw*.7;
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(mx,by-3);ctx.lineTo(mx,by+bh+3);ctx.stroke();
    ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillStyle='rgba(216,180,254,.8)';
    ctx.fillText('70% capangas',mx,by+bh+13);
    ctx.restore();ctx.textAlign='left';
  }
}

  });
}

function updateEmailEnemies(mode){
  var aggro=mode==='boss'||bossKneel||gamePhase>=2;
  emailWave.forEach(function(e){
    if(!e.alive)return;
    e.wobbleT+=.044;
    var tx=charX,ty=charY-58;
    var dx=tx-e.x,dy=ty-e.y;
    var dist=Math.max(1,Math.hypot(dx,dy));
    if(e.dashT>0){
      e.x+=e.dashVx;
      e.y+=e.dashVy;
      e.dashT--;
      e.fl=5;
      trail2(e.x,e.y,'#ef4444');
      if(e.dashT===0){
        e.atkCd=aggro?70+Math.random()*70:95+Math.random()*95;
        e.charge=0;
      }
    } else {
      e.x+=e.vx+(aggro?dx/dist*(1.15+bPhase*.18):dx*.010);
      e.y+=Math.sin(e.wobbleT)*.75+(aggro?dy/dist*(.85+bPhase*.12):dy*.010);
      e.atkCd--;
      e.charge=0;
      if(aggro&&e.atkCd<28){
        e.charge=28-e.atkCd;
        e.fl=4;
      }
      if(aggro&&e.atkCd<=0){
        var sp=7.4+bPhase*.75;
        e.dashVx=dx/dist*sp;
        e.dashVy=dy/dist*sp;
        e.dashT=16;
        e.atkCd=999;
        lbl(e.x-22,e.y-28,'ATAQUE!','#ef4444',10);
      }
    }
    if(e.x<62){e.x=62;e.vx=Math.abs(e.vx);}
    if(e.x>W-62){e.x=W-62;e.vx=-Math.abs(e.vx);}
    if(e.y<54)e.y=54;
    if(e.y>FLOOR-55)e.y=FLOOR-55;
  });
}

function drawEmailWave(){
  emailWave.forEach(function(e){
    if(!e.alive)return;
    var cw=82,ch=54,cx2=e.x-cw/2,cy2=e.y-ch/2;
    ctx.save();
    if(e.charge>0){
      ctx.save();
      ctx.globalAlpha=Math.min(.65,e.charge/28);
      ctx.strokeStyle='#ef4444';ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(charX,charY-58);ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    /* card shadow */
    ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
    ctx.fillStyle=e.fl>0?'#fef2f2':'#ffffff';
    if(ctx.roundRect)ctx.roundRect(cx2,cy2,cw,ch,8);else ctx.rect(cx2,cy2,cw,ch);
    ctx.fill();
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.strokeStyle=e.fl>0?'#fca5a5':e.s.avBg;ctx.lineWidth=1.5;
    if(ctx.roundRect)ctx.roundRect(cx2,cy2,cw,ch,8);else ctx.rect(cx2,cy2,cw,ch);
    ctx.stroke();
    /* unread dot */
    ctx.fillStyle=e.fl>0?'#ef4444':'#3b82f6';
    ctx.beginPath();ctx.arc(cx2+9,e.y-2,3.5,0,Math.PI*2);ctx.fill();
    /* avatar */
    ctx.fillStyle=e.s.avBg;
    ctx.beginPath();ctx.arc(cx2+26,e.y-2,11,0,Math.PI*2);ctx.fill();
    ctx.font='bold 8px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.fillText(e.s.avL,cx2+26,e.y+2);
    /* sender + subject */
    ctx.font='bold 7.5px sans-serif';ctx.fillStyle='#111827';ctx.textAlign='left';
    ctx.fillText(e.s.name.substring(0,13),cx2+42,cy2+17);
    ctx.font='6.5px sans-serif';ctx.fillStyle='#6b7280';
    ctx.fillText('Clique para deletar →',cx2+42,cy2+28);
    /* chip */
    ctx.fillStyle=e.s.cBg;
    if(ctx.roundRect)ctx.roundRect(cx2+42,cy2+34,30,12,3);else ctx.rect(cx2+42,cy2+34,30,12);
    ctx.fill();
    ctx.font='6px sans-serif';ctx.fillStyle=e.s.cFg;ctx.textAlign='center';
    ctx.fillText(e.s.chip,cx2+57,cy2+42);
    ctx.restore();
    if(e.fl>0)e.fl--;
  });
}

function drawWin(){
  winF++;
  ctx.save();ctx.fillStyle='rgba(0,18,8,'+Math.min(.72,winF/60)+')';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(winF>28){
    ctx.globalAlpha=Math.min(1,(winF-28)/28);
    ctx.font='bold 54px monospace';ctx.fillStyle='#4ade80';
    ctx.shadowColor='#4ade80';ctx.shadowBlur=32;ctx.fillText('INBOX ZERO!',W/2,H/2-28);ctx.shadowBlur=0;
    ctx.font='bold 17px monospace';ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.fillText('Você arquivou tudo. A vitória é sua.',W/2,H/2+18);
    ctx.font='11px monospace';ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.fillText('[SPACE para jogar de novo]',W/2,H/2+52);
  }
  ctx.restore();ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawLose(){
  loseF++;
  ctx.save();ctx.fillStyle='rgba(18,0,0,'+Math.min(.72,loseF/60)+')';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(loseF>28){
    ctx.globalAlpha=Math.min(1,(loseF-28)/28);
    ctx.font='bold 46px monospace';ctx.fillStyle='#ef4444';
    ctx.shadowColor='#ef4444';ctx.shadowBlur=28;ctx.fillText('VOCÊ PERDEU…',W/2,H/2-26);ctx.shadowBlur=0;
    ctx.font='17px monospace';ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fillText('O inbox venceu desta vez.',W/2,H/2+18);
    ctx.font='11px monospace';ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.fillText('[SPACE para tentar de novo]',W/2,H/2+50);
  }
  ctx.restore();ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function drawBossHappy(){
  var bw=200,bh=155;
  var bob=Math.sin(bBobT)*5;
  ctx.save();
  ctx.translate(BOSS_X,BOSS_Y+bob+bh/2);
  /* teal glow */
  ctx.save();ctx.globalAlpha=.28+Math.sin(aT*2)*.12;
  var hg=ctx.createRadialGradient(0,0,10,0,0,118);
  hg.addColorStop(0,'rgba(74,222,128,.7)');hg.addColorStop(1,'rgba(15,118,110,0)');
  ctx.beginPath();ctx.arc(0,0,118,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
  ctx.restore();
  /* envelope branco */
  var ex=-bw/2,ey=-bh/2;
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#0f766e';ctx.lineWidth=2.5;
  if(ctx.roundRect)ctx.roundRect(ex,ey,bw,bh,10);else ctx.rect(ex,ey,bw,bh);
  ctx.fill();ctx.stroke();
  /* Gmail M real */
  ctx.strokeStyle='#EA4335';ctx.lineWidth=5;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(ex+8,ey+3);ctx.lineTo(0,ey+bh*0.38);ctx.lineTo(ex+bw-8,ey+3);ctx.stroke();
  /* "INBOX ZERO" */
  ctx.font='bold 15px monospace';ctx.textAlign='center';ctx.fillStyle='#0f766e';
  ctx.fillText('INBOX ZERO!',0,ey+bh*0.54);
  /* olhos felizes */
  var eyeY=ey+bh*0.72;
  ctx.fillStyle='#1f2937';
  ctx.beginPath();ctx.arc(-28,eyeY,7,0,Math.PI*2);ctx.arc(28,eyeY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-25,eyeY-2,3,0,Math.PI*2);ctx.arc(31,eyeY-2,3,0,Math.PI*2);ctx.fill();
  /* sorriso */
  ctx.strokeStyle='#0f766e';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,ey+bh*0.87,22,.12,Math.PI-.12);ctx.stroke();
  /* sparkles */
  ctx.save();ctx.globalAlpha=.6+Math.sin(aT*3)*.4;ctx.fillStyle='#4ade80';
  var sp=[[-82,-38],[84,-20],[-70,22],[90,45],[-88,55]];
  sp.forEach(function(s){
    ctx.save();ctx.translate(s[0],s[1]);ctx.rotate(aT*1.5);
    ctx.beginPath();
    for(var i=0;i<4;i++){ctx.lineTo(Math.cos(i*Math.PI/2)*7,Math.sin(i*Math.PI/2)*7);ctx.lineTo(Math.cos((i+.5)*Math.PI/2)*3,Math.sin((i+.5)*Math.PI/2)*3);}
    ctx.closePath();ctx.fill();ctx.restore();
  });
  ctx.restore();
  ctx.restore();ctx.textAlign='left';
}

/* ══ LOOP ══ */
function loop(){
  ctx.clearRect(0,0,W,H);
  drawBg();drawFlash();

  if(gs==='intro'){
    drawDesk();drawSeated();
    ctx.save();ctx.globalAlpha=.4+Math.abs(Math.sin(aT*2.5))*.4;
    ctx.font='bold 12px monospace';ctx.fillStyle='#9ca3af';ctx.textAlign='center';
    ctx.fillText('[ SPACE para começar ]',W/2,FLOOR+42);
    ctx.restore();ctx.textAlign='left';

  } else if(gs==='rising'){
    introF++;
    var t=introF/55,ease=1-Math.pow(1-t,3);
    if(introF===28){
      flashA=.38;flashC='#fbbf24';
      for(var di=0;di<16;di++){
        var da=Math.random()*Math.PI*2,dsp=3+Math.random()*8;
        dsk.push({x:BASE_X+(Math.random()-.5)*80,y:FLOOR+(Math.random()-.5)*30,
          vx:Math.cos(da)*dsp,vy:Math.sin(da)*dsp-5,
          rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.25,
          w:12+Math.random()*38,h:7+Math.random()*14,
          col:di%3===0?'#fff':di%3===1?'#4a3220':'#cbd5e1',life:1});
      }
    }
    var rY=lerp(FLOOR-6,FLOOR,1-ease);
    drawDsk();if(introF<28)drawDesk();
    drawChar(BASE_X,rY,false,0,0);
    if(t>.38){
      var br=(t-.38)/.62*88;
      var b2=ctx.createRadialGradient(BASE_X,rY-40,0,BASE_X,rY-40,br);
      b2.addColorStop(0,'rgba(251,191,36,.5)');b2.addColorStop(1,'rgba(251,191,36,0)');
      ctx.beginPath();ctx.arc(BASE_X,rY-40,br,0,Math.PI*2);ctx.fillStyle=b2;ctx.fill();
    }
    if(introF>=55){gs='fight';pStage=1;pCombo=1;syncLbl();}

  } else if(gs==='fight'){
    /* Jump Physics */
    if(keys.up && charY >= FLOOR) {
        pVY = -12.5; // Jump strength
    }
    charY += pVY;
    pVY += 0.6; // Gravity
    if(charY > FLOOR) {
        charY = FLOOR;
        pVY = 0;
    }

    /* Ki Decay System */
    if(pKi > 0 && !pAtk) {
       pKi -= 0.15; // Slow drain when idle
       var expectedStage = pKi >= 90 ? 3 : pKi >= 60 ? 2 : pKi >= 30 ? 1 : 0;
       if (expectedStage !== pStage) {
           pStage = expectedStage;
           updateHeroSprites(); // Revert hair color when Ki drops
       }
    }

    /* Combo Timer Decay */
    if(comboTimer > 0) comboTimer--;
    else { comboBuffer = []; attackChain = 0; }
    if(comboTextTimer > 0) comboTextTimer--;

    /* movement with velocity */
    if(keys.l)pVX=lerp(pVX,-7,.18);
    else if(keys.r)pVX=lerp(pVX,7,.18);
    else pVX=lerp(pVX,0,.22);
    
    if(!pAtk&&!pSpec)px=clamp(px+pVX,55,W/2-30);
    
    var baseFY=charY; // Use true physics charY instead of locked FLOOR

    if(pAtk){
      var at=pAtkF/15;
      charX=lerp(charX, px, Math.sin(at*Math.PI*.5)); // Dash towards PX instantly
      if(pAtkF%2===0)trail2(charX,charY-30,STAGES[pStage].col);
    } else {
      charX+=(px-charX)*.3; // Much faster follow so it feels snappy
    }

    if(gamePhase===1){
      /* phase 1: email wave */
      if(pAtk&&pAtkF===10){
        var bestI=-1,bestD=999;
        emailWave.forEach(function(e,i){
          if(!e.alive)return;
          var d=Math.hypot(e.x-charX,e.y-charY);
          if(d<200&&d<bestD){bestD=d;bestI=i;}
        });
        if(bestI>=0){
          emailWave[bestI].alive=false;waveKilled++;
          burst(emailWave[bestI].x,emailWave[bestI].y,STAGES[pStage].col,false);
          lbl(emailWave[bestI].x,emailWave[bestI].y-20,'DELETADO!',STAGES[pStage].col,12);
        }
      }
      /* spawn */
      waveSpawnT--;
      if(waveSpawnT<=0&&(emailWave.filter(function(e){return e.alive;}).length+waveKilled)<WAVE_TOTAL){
        spawnEmailEnemy();waveSpawnT=85;
      }
      updateEmailEnemies('wave');
      /* player-email collision -> capangas give damage more aggressively */
      emailWave.forEach(function(e){
        if(!e.alive)return;
        if(pInv===0&&Math.hypot(e.x-charX,e.y-charY)<40){
          pHP=Math.max(0,pHP-8);pInv=40;flashA=.2;flashC='#ef4444';
          lbl(charX-18,charY-80,'-8','#f87171',12);
          if(pHP<=0){gs='lose';loseF=0;}
        }
      });
      drawTrail();drawEmailWave();
      drawChar(charX,charY,pAtk,pStage,pInv);
      drawKameha();drawRings();drawShards();drawLbls();drawDsk();drawHUD();
      /* wave counter */
      ctx.font='bold 11px monospace';ctx.fillStyle='rgba(255,255,255,.38)';ctx.textAlign='right';
      ctx.fillText('Emails: '+waveKilled+'/'+WAVE_TOTAL,W-14,H-14);ctx.textAlign='left';
      /* wave cleared? */
      if(waveKilled>=WAVE_TOTAL&&!bossEntrance){
        bossEntrance=true;bossEntranceF=0;flashA=.35;flashC='#ef4444';
        emailWave=[];gamePhase=2;
      }

    } else if(bossEntrance){
      /* boss entrance cinematic */
      bossEntranceF++;
      var bt=Math.min(1,bossEntranceF/72);
      var bease=1-Math.pow(1-bt,3);
      ctx.save();ctx.translate((1-bease)*(W-BOSS_X+120),0);drawBoss();ctx.restore();
      if(bossEntranceF===64){flashA=.55;flashC='#ef4444';lbl(W/2-22,H/3,'BOSS!','#ef4444',30);triggerCutin('INBOX 999+ DESPERTOU','#ef4444','boss');}
      drawTrail();drawChar(charX,charY,pAtk,pStage,pInv);drawHUD();
      ctx.save();ctx.globalAlpha=.45+Math.abs(Math.sin(aT*5))*.45;
      ctx.font='bold 14px monospace';ctx.fillStyle='#ef4444';ctx.textAlign='center';
      ctx.fillText('▶ INBOX BOSS CHEGANDO!',W/2,H-28);
      ctx.restore();ctx.textAlign='left';
      if(bossEntranceF>=92){bossEntrance=false;gamePhase=2;bAtkT=120;}

    } else if(bossKneel){
      /* kneel sub-phase: boss tilted, 5 email minions attack */
      bossKneelF++;
      kneelSpawnTimer--;
      if(kneelSpawnTimer<=0&&kneelSpawned<KNEEL_WAVE){
        spawnEmailEnemy();kneelSpawned++;kneelSpawnTimer=45;
      }
      if(pAtk&&pAtkF===10){
        var bestKI=-1,bestKD=999;
        emailWave.forEach(function(e,i){
          if(!e.alive)return;
          var d=Math.hypot(e.x-charX,e.y-charY);
          if(d<200&&d<bestKD){bestKD=d;bestKI=i;}
        });
        if(bestKI>=0){
          emailWave[bestKI].alive=false;kneelKilled++;
          burst(emailWave[bestKI].x,emailWave[bestKI].y,STAGES[pStage].col,false);
          lbl(emailWave[bestKI].x,emailWave[bestKI].y-20,'DELETADO!',STAGES[pStage].col,12);
        }
      }
      updateEmailEnemies('boss');
      emailWave.forEach(function(e){
        if(!e.alive)return;
        if(pInv===0&&Math.hypot(e.x-charX,e.y-charY)<36){
          pHP=Math.max(0,pHP-10);pInv=50;flashA=.2;flashC='#ef4444';
          lbl(charX-18,charY-80,'-10','#f87171',12);
          if(pHP<=0){gs='lose';loseF=0;}
        }
      });
      if(kneelKilled>=KNEEL_WAVE){
        bossKneel=false;bossAfterKneel=true;emailWave=[];
        bPhase=Math.max(bPhase,3);bAtkT=80;
        flashA=.48;flashC='#ef4444';
        lbl(BOSS_X-50,BOSS_Y-18,'MODO RAIVA!','#ef4444',16);
        burst(BOSS_X,BOSS_Y+77,'#ef4444',true);
        pAtkTargetX=BOSS_X;pAtkTargetY=BOSS_Y+77;
      }
      drawTrail();drawBoss();drawEmailWave();
      drawChar(charX,charY,pAtk,pStage,pInv);
      drawKameha();drawRings();drawShards();drawLbls();drawDsk();drawHUD();
      ctx.font='bold 11px monospace';ctx.fillStyle='rgba(200,150,255,.5)';ctx.textAlign='right';
      ctx.fillText('Minions: '+kneelKilled+'/'+KNEEL_WAVE,W-14,H-14);ctx.textAlign='left';

    } else {
      /* phase 2: boss fight */
      if(pAtk&&pAtkF===10){
        var dmg=pStage>=3?25:pStage>=2?20:15;
        bHP=Math.max(0,bHP-dmg);bFlash=12;bShake=1.2;
        burst(BOSS_X+(Math.random()-.5)*80,BOSS_Y+40+Math.random()*90,STAGES[pStage].col,false);
        lbl(BOSS_X-28,BOSS_Y-14,'-'+dmg,STAGES[pStage].col,14);
        checkPhase();
        if(bHP<=0){triggerWin();}
        else{maybeTriggerMinionPhase(0);}
      }
      bAtkT--;
      if(bAtkT<=0){bossShoot();bAtkT=BPHASES[bPhase].atkInt+(bPhase<3?Math.floor(Math.random()*35):0);}
      projs=projs.filter(function(p){
        p.x+=p.vx;p.y+=p.vy;p.vy+=.07;if(p.fl>0)p.fl--;
        if(pInv===0&&Math.hypot(p.x-charX,p.y-charY)<26){
          pHP=Math.max(0,pHP-15);pInv=55;flashA=.24;flashC='#ef4444';
          lbl(charX-18,charY-80,'-15','#f87171',13);
          rings.push({x:charX,y:charY-40,r:5,life:1,col:'#ef4444'});
          if(pHP<=0){gs='lose';loseF=0;}return false;
        }
        return p.x>-30&&p.x<W+30&&p.y<H+30;
      });
      drawTrail();drawBoss();drawProjs();
      drawChar(charX,charY,pAtk,pStage,pInv);
      drawKameha();drawRings();drawShards();drawLbls();drawDsk();drawHUD();
    }

    if(pAtk){pAtkF++;if(pAtkF>=15){pAtk=false;pAtkF=0;pState='idle';}}
    if(pInv>0)pInv--;

  } else if(gs==='win'){
    drawBossHappy();drawChar(charX,charY,false,pStage,0);
    drawRings();drawShards();drawLbls();drawHUD();drawWin();
  } else if(gs==='lose'){
    drawBoss();drawProjs();drawHUD();drawLose();
  }

  drawCutin();

  /* tick */
  aT+=.05;iT+=.018;bBobT+=.04;
  if(cutinT>0)cutinT--;
  if(bossIntentT>0)bossIntentT--;
  flashA=Math.max(0,flashA-.042);
  if(bFlash>0)bFlash--;if(bShake>0)bShake=Math.max(0,bShake-.08);
  trail=trail.filter(function(p){p.life-=.06;return p.life>0;});
  shards=shards.filter(function(s){
    s.x+=s.vx;s.y+=s.vy;s.vy+=.24;s.life-=.025;
    if(s.type==='r')s.rot+=s.rv;return s.life>0;
  });
  dsk=dsk.filter(function(s){s.x+=s.vx;s.y+=s.vy;s.vy+=.2;s.life-=.016;s.rot+=s.rv;return s.life>0;});
  rings=rings.filter(function(r){r.r+=4.5;r.life-=.05;return r.life>0;});
  lbls=lbls.filter(function(l){l.y+=l.vy;l.life-=.022;return l.life>0;});
  requestAnimationFrame(loop);
}

C.addEventListener('click', function() { attack('Z'); });
document.addEventListener('keydown',function(ev){
  if(ev.code==='Space'||ev.code==='KeyZ'){ev.preventDefault();attack('Z');return;}
  if(ev.code==='KeyX'){ev.preventDefault();attack('X');return;}
  if(ev.code==='KeyC'){ev.preventDefault();attack('C');return;}
  if(ev.code==='ArrowUp'||ev.code==='KeyW'){ev.preventDefault();keys.up=true;}
  if(ev.code==='ArrowDown'||ev.code==='KeyS'){ev.preventDefault();keys.down=true; pushCombo('DOWN');}
  if(ev.code==='ArrowLeft'||ev.code==='KeyA'){ev.preventDefault();keys.l=true; pushCombo('LEFT');}
  if(ev.code==='ArrowRight'||ev.code==='KeyD'){ev.preventDefault();keys.r=true; pushCombo('RIGHT');}
});
document.addEventListener('keyup',function(ev){
  if(ev.code==='ArrowUp'||ev.code==='KeyW')keys.up=false;
  if(ev.code==='ArrowDown'||ev.code==='KeyS')keys.down=false;
  if(ev.code==='ArrowLeft'||ev.code==='KeyA')keys.l=false;
  if(ev.code==='ArrowRight'||ev.code==='KeyD')keys.r=false;
});
document.getElementById('btn-reset').addEventListener('click',reset);
loop();
})();
