<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inbox Fighter - Visualizador de Assets</title>
    <style>
    :root {
      --panel: rgba(15, 23, 42, .82);
      --panel-2: rgba(30, 41, 59, .78);
      --line: rgba(148, 163, 184, .18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --gold: #facc15;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 14%, rgba(250, 204, 21, .13), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(56, 189, 248, .14), transparent 30%),
        linear-gradient(140deg, #090d14 0%, #111827 44%, #15110b 100%);
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    .shell { width: min(1180px, 100%); margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; color: #f8fafc; font-size: clamp(28px, 4vw, 54px); line-height: .9; letter-spacing: 0; text-transform: uppercase; }
    h2 { margin: 34px 0 16px; color: #f8fafc; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
    .badge {
      display: inline-flex; align-items: center; min-height: 30px; padding: 7px 11px;
      border: 1px solid rgba(250, 204, 21, .34); border-radius: 6px;
      background: rgba(250, 204, 21, .1); color: #fef3c7;
      font-size: 12px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
    button {
      background: rgba(15, 23, 42, .72); color: var(--text); border: 1px solid var(--line);
      padding: 9px 13px; border-radius: 6px; cursor: pointer; font-size: 13px;
      font-weight: 800; letter-spacing: .03em; text-transform: uppercase; transition: all .2s;
    }
    button:hover, button.active {
      background: linear-gradient(135deg, #2563eb, #0f766e); color: white;
      border-color: rgba(125, 211, 252, .82); box-shadow: 0 0 0 1px rgba(125, 211, 252, .18), 0 12px 34px rgba(37, 99, 235, .22);
    }
    .lab { display: grid; grid-template-columns: minmax(320px, 1fr) 320px; gap: 18px; align-items: stretch; margin-bottom: 24px; }
    .stage {
      position: relative; min-height: 390px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px;
      background:
        radial-gradient(circle at 50% 34%, var(--aura, rgba(250, 204, 21, .28)), transparent 28%),
        radial-gradient(circle at 50% 58%, rgba(249, 115, 22, .13), transparent 26%),
        linear-gradient(180deg, rgba(2, 6, 23, .28), rgba(2, 6, 23, .72)),
        repeating-linear-gradient(90deg, rgba(148, 163, 184, .07) 0 1px, transparent 1px 74px);
      box-shadow: inset 0 -80px 110px rgba(2, 6, 23, .62);
    }
    .stage::before, .stage::after {
      content: ""; position: absolute; inset: 50% auto auto 50%; width: 310px; height: 310px;
      border: 2px solid rgba(250, 204, 21, .26); border-radius: 50%; transform: translate(-50%, -50%) scale(.85);
      animation: auraPulse 1.8s infinite ease-in-out;
    }
    .stage::after { width: 430px; height: 430px; border-color: rgba(56, 189, 248, .2); animation-delay: -.65s; }
    .ground { position: absolute; left: 9%; right: 9%; bottom: 42px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(2, 6, 23, .72), transparent 68%); filter: blur(1px); }
    .speed-lines {
      position: absolute; inset: 0; opacity: .32;
      background: linear-gradient(105deg, transparent 0 22%, rgba(255,255,255,.22) 23%, transparent 24% 48%, rgba(255,255,255,.16) 49%, transparent 50% 100%);
      mix-blend-mode: screen; transform: translateX(-14%); animation: speedSweep 1.4s infinite linear; pointer-events: none;
    }
    .hero-focus { position: absolute; left: 50%; bottom: 28px; width: 252px; height: 322px; transform: translateX(-50%); display: grid; place-items: end center; z-index: 2; }
    .hero-focus img { width: 245px; height: 320px; max-width: none; max-height: none; object-fit: contain; filter: drop-shadow(0 24px 22px rgba(0,0,0,.4)) drop-shadow(0 0 18px rgba(250, 204, 21, .26)); transform-origin: 52% 78%; }
    .hero-focus.idle img { animation: idleBreath 1.25s infinite ease-in-out; }
    .hero-focus.jab_start img, .hero-focus.jab_active img, .hero-focus.jab_recover img { animation: punchSnap .78s infinite cubic-bezier(.2,.8,.25,1); }
    .hero-focus.cross_start img, .hero-focus.cross_active img { animation: punchSnapAlt .78s infinite cubic-bezier(.2,.8,.25,1); }
    .hero-focus.kick_start img, .hero-focus.kick_active img { animation: kickFloat .92s infinite cubic-bezier(.2,.8,.28,1); }
    .hero-focus.special_charge img { animation: chargeWindup .86s infinite ease-in-out; filter: drop-shadow(0 24px 22px rgba(0,0,0,.42)) drop-shadow(0 0 24px rgba(96,165,250,.62)); }
    .hero-focus.special_fire img { animation: chargeStance 1.05s infinite ease-in-out; filter: drop-shadow(0 24px 22px rgba(0,0,0,.42)) drop-shadow(0 0 26px rgba(96,165,250,.82)); }
    .hero-focus.win img { animation: winBounce 1.05s infinite ease-in-out; }
    /* legacy */
    .hero-focus.punch img { animation: punchSnap .78s infinite cubic-bezier(.2,.8,.25,1); }
    .hero-focus.kick img { animation: kickFloat .92s infinite cubic-bezier(.2,.8,.28,1); }
    .stage.kameha::before { border-color: rgba(147, 197, 253, .48); box-shadow: 0 0 48px rgba(59, 130, 246, .28); }
    .stage.kameha .speed-lines { opacity: .54; background: linear-gradient(100deg, transparent 0 18%, rgba(147,197,253,.42) 19%, transparent 21% 54%, rgba(255,255,255,.26) 55%, transparent 58%); }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 16px; backdrop-filter: blur(10px); }
    .panel h2 { margin-top: 0; }
    .stat { display: grid; gap: 6px; margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .meter { height: 8px; overflow: hidden; border-radius: 999px; background: rgba(15, 23, 42, .9); border: 1px solid rgba(148, 163, 184, .16); }
    .meter span { display: block; height: 100%; width: var(--power, 30%); background: linear-gradient(90deg, #f97316, #facc15, #38bdf8); border-radius: inherit; box-shadow: 0 0 20px rgba(250, 204, 21, .38); transition: width .2s ease; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 14px; margin-bottom: 38px; }
    .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; min-width: 0; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .card:hover, .card.active { transform: translateY(-3px); border-color: rgba(250, 204, 21, .55); box-shadow: 0 18px 46px rgba(0,0,0,.28); }
    .card h3 { margin: 0 0 10px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .asset-container { position: relative; width: 150px; height: 176px; display: flex; justify-content: center; align-items: end; overflow: hidden; background: radial-gradient(circle at 50% 42%, rgba(250,204,21,.2), transparent 42%), radial-gradient(circle, rgba(148,163,184,.2) 1px, transparent 1px); background-size: auto, 18px 18px; background-position: center; border-radius: 4px; }
    .asset-container::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 13px; height: 11px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(2,6,23,.64), transparent 70%); }
    .asset-container.large { width: 300px; height: 300px; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .asset-container img { position: relative; z-index: 1; width: 138px; height: 168px; max-width: none; max-height: none; object-fit: contain; transform-origin: 52% 78%; filter: drop-shadow(0 13px 12px rgba(0,0,0,.32)); }
    .asset-container.idle img { animation: idleBreath 1.25s infinite ease-in-out; }
    .asset-container.jab_start img, .asset-container.jab_active img, .asset-container.jab_recover img { animation: punchSnap .78s infinite cubic-bezier(.2,.8,.25,1); }
    .asset-container.cross_start img, .asset-container.cross_active img { animation: punchSnapAlt .78s infinite cubic-bezier(.2,.8,.25,1); }
    .asset-container.kick_start img, .asset-container.kick_active img { animation: kickFloat .92s infinite cubic-bezier(.2,.8,.28,1); }
    .asset-container.special_charge img { animation: chargeWindup .86s infinite ease-in-out; }
    .asset-container.special_fire img { animation: chargeStance 1.05s infinite ease-in-out; }
    .asset-container.win img { animation: winBounce 1.05s infinite ease-in-out; }
    .enemy-grid .asset-container img { width: auto; height: auto; max-width: 100%; max-height: 100%; animation: none; }
    @keyframes auraPulse { 0%, 100% { opacity: .38; transform: translate(-50%, -50%) scale(.78); } 50% { opacity: .82; transform: translate(-50%, -50%) scale(1.04); } }
    @keyframes speedSweep { from { transform: translateX(-28%); } to { transform: translateX(24%); } }
    @keyframes idleBreath { 0%, 100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-5px) scaleX(1.025); } }
    @keyframes punchSnap { 0%, 100% { transform: translateX(0) rotate(0deg); } 38% { transform: translateX(13px) rotate(2deg) scaleX(1.04); } 58% { transform: translateX(-4px) rotate(-1deg); } }
    @keyframes punchSnapAlt { 0%, 100% { transform: translateX(0) rotate(0deg); } 38% { transform: translateX(-13px) rotate(-2deg) scaleX(1.04); } 58% { transform: translateX(4px) rotate(1deg); } }
    @keyframes kickFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 42% { transform: translateY(-9px) rotate(-4deg) scale(1.03); } 68% { transform: translateY(2px) rotate(2deg); } }
    @keyframes kickFloatAlt { 0%, 100% { transform: translateY(0) rotate(0deg); } 42% { transform: translateY(-9px) rotate(4deg) scale(1.03); } 68% { transform: translateY(2px) rotate(-2deg); } }
    @keyframes chargeWindup { 0%, 100% { transform: translateY(0) scale(.96) rotate(-1deg); } 50% { transform: translateY(-5px) scale(1.05) rotate(1deg); } }
    @keyframes chargeStance { 0%, 100% { transform: translateY(0) scale(.99); } 50% { transform: translateY(-3px) scale(1.035); } }
    @keyframes winBounce { 0%, 100% { transform: translateY(0) rotate(-1deg); } 45% { transform: translateY(-12px) rotate(3deg); } }
    @media (max-width: 780px) { body { padding: 14px; } .topbar { align-items: start; flex-direction: column; } .lab { grid-template-columns: 1fr; } .stage { min-height: 340px; } .hero-focus { width: 220px; height: 292px; } .hero-focus img { width: 216px; height: 288px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <h1>Inbox Fighter<br>Character Lab</h1>
      <span class="badge" id="stage-badge">LEVEL 0 / IDLE</span>
    </div>

    <section class="lab">
      <div class="stage idle" id="motion-stage" style="--aura: rgba(148, 163, 184, .18);">
        <div class="speed-lines"></div>
        <div class="hero-focus idle" id="hero-focus">
          <img id="hero-live" alt="Hero preview">
        </div>
        <div class="ground"></div>
      </div>
      <aside class="panel">
        <h2>Motion Lab</h2>
        <div class="controls" id="level-controls">
          <button onclick="setLevel(0)" class="active" id="btn-0">Base</button>
          <button onclick="setLevel(1)" id="btn-1">SSJ1</button>
          <button onclick="setLevel(2)" id="btn-2">SSJ3</button>
          <button onclick="setLevel(3)" id="btn-3">Ultra</button>
        </div>
        <h2>Pose</h2>
        <div class="controls" id="pose-controls">
          <button onclick="setPose('idle')" class="active" id="pose-idle">Idle</button>
          <button onclick="setPose('jab_start')" id="pose-jab_start">Jab →</button>
          <button onclick="setPose('jab_active')" id="pose-jab_active">Jab ⚡</button>
          <button onclick="setPose('jab_recover')" id="pose-jab_recover">Jab ←</button>
          <button onclick="setPose('cross_start')" id="pose-cross_start">Cross →</button>
          <button onclick="setPose('cross_active')" id="pose-cross_active">Cross ⚡</button>
          <button onclick="setPose('kick_start')" id="pose-kick_start">Kick →</button>
          <button onclick="setPose('kick_active')" id="pose-kick_active">Kick ⚡</button>
          <button onclick="setPose('special_charge')" id="pose-special_charge">Charge</button>
          <button onclick="setPose('special_fire')" id="pose-special_fire">Fire</button>
          <button onclick="setPose('win')" id="pose-win">Win</button>
        </div>
        <div class="controls" style="margin-top:8px">
          <button onclick="toggleDebug()" id="btn-debug">Debug Anchors</button>
        </div>
        <div class="stat">
          <strong id="pose-name">IDLE</strong>
          <div class="meter"><span id="power-meter"></span></div>
          <span id="pose-note">Guarda base com respiracao e aura leve.</span>
        </div>
      </aside>
    </section>

    <h2>Hero Poses</h2>
    <div class="grid" id="hero-grid"></div>

    <h2>Enemies</h2>
    <div class="grid enemy-grid" id="enemy-grid"></div>
  </main>
<script>
// ==========================================
// FUNÇÕES DE GERAÇÃO DE SVG (Copiar do jogo)
// ==========================================
function getHeroSVG(level, pose, debugMode) {
  let hairCol = level >= 3 ? '#e2e8f0' : (level >= 1 ? '#fde047' : '#1f2937');
  let strokeCol = level >= 3 ? '#94a3b8' : (level >= 1 ? '#ca8a04' : '#111827');
  let hairGlow = level >= 1 ? `<circle cx="50" cy="15" r="50" fill="${hairCol}" opacity="0.4" filter="blur(6px)"/>` : '';
  let mColor = level >= 3 ? '#e2e8f0' : (level >= 1 ? '#ca8a04' : '#ea4335');

  // Normalize legacy pose names
  const POSE_LEGACY = {'punch':'jab_active','punch2':'cross_active','kick':'kick_active','kick2':'kick_active','special-start':'special_charge','kameha':'special_fire'};
  const rp = POSE_LEGACY[pose] || pose;

  // Anchor table: neckAnchor (nx,ny) = where envelope pivot sits; hr = head tilt
  // Envelope pivot = bottom-center of rect(x=25,y=10,w=50,h=35) → (50, 45)
  // headTX = nx-50, headTY = ny-45 → pivot lands exactly on neckAnchor
  const A = {
    idle:           {nx:50,ny:31,hr: 0},
    jab_start:      {nx:53,ny:29,hr: 8},
    jab_active:     {nx:55,ny:28,hr:12},
    jab_recover:    {nx:51,ny:30,hr: 4},
    cross_start:    {nx:47,ny:29,hr:-8},
    cross_active:   {nx:45,ny:28,hr:-12},
    kick_start:     {nx:48,ny:27,hr:-10},
    kick_active:    {nx:46,ny:26,hr:-15},
    special_charge: {nx:50,ny:33,hr: 5},
    special_fire:   {nx:52,ny:30,hr: 8},
    win:            {nx:50,ny:25,hr:-8},
  };
  const a = A[rp] || A.idle;
  const htx = a.nx - 50, hty = a.ny - 45;
  const hxf = `translate(${htx},${hty}) rotate(${a.hr},${a.nx},${a.ny})`;

  // Body geometry type
  const bt = ['jab_start','jab_active','jab_recover'].includes(rp) ? 'punch'
    : ['cross_start','cross_active'].includes(rp) ? 'cross'
    : ['kick_start','kick_active'].includes(rp) ? 'kick'
    : ['special_charge','special_fire'].includes(rp) ? 'kameha'
    : rp;
  
  const hairShade = level >= 3 ? '#cbd5e1' : (level >= 1 ? '#f59e0b' : '#020617');
  const hairHi = level >= 3 ? '#f8fafc' : (level >= 1 ? '#fef08a' : '#334155');
  const backHairSVG = level >= 2 ? `
    <g class="anime-back-hair" stroke="${strokeCol}" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M24,18 C2,44 -8,84 2,132 C17,103 25,79 31,50 Z" fill="${hairCol}"/>
      <path d="M76,18 C98,44 108,84 98,132 C83,103 75,79 69,50 Z" fill="${hairCol}"/>
      <path d="M36,16 C20,52 19,86 31,122 C42,88 45,58 45,26 Z" fill="${hairShade}" opacity=".9"/>
      <path d="M64,16 C80,52 81,86 69,122 C58,88 55,58 55,26 Z" fill="${hairShade}" opacity=".9"/>
    </g>
  ` : '';
  const frontHairSVG = `
    <g class="anime-front-hair" stroke="${strokeCol}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M21,22 C11,18 4,9 -3,-7 C12,0 22,2 30,8 C26,-9 30,-24 39,-39 C43,-18 47,-6 50,5 C55,-17 63,-34 75,-47 C77,-23 73,-7 67,8 C78,1 89,-7 101,-21 C101,-3 92,12 78,23 C70,16 61,13 50,13 C39,13 29,16 21,22 Z" fill="${hairCol}"/>
      <path d="M33,9 C38,-6 42,-20 49,-32 C49,-15 50,-4 51,10 Z" fill="${hairHi}" opacity=".62"/>
      <path d="M52,10 C58,-10 65,-25 75,-40 C74,-19 70,-5 64,11 Z" fill="${hairHi}" opacity=".46"/>
      <path d="M23,20 C30,15 39,13 50,13 C61,13 70,15 78,23 C70,20 61,19 50,19 C38,19 29,20 23,20 Z" fill="${hairShade}" opacity=".78"/>
      <path d="M19,24 C9,25 1,18 -8,8 C7,10 18,13 27,18 Z" fill="${hairCol}"/>
      <path d="M81,24 C91,25 99,18 108,8 C93,10 82,13 73,18 Z" fill="${hairCol}"/>
    </g>
  `;

  const gi = '#f97316', giDark = '#c2410c', giDeep = '#9a3412';
  const blue = '#1e3a8a', blueDark = '#172554', skin = '#fcd34d', skinDark = '#d97706';
  const trim = '#facc15', bootRed = '#b91c1c', ink = '#111827';

  let bodySVG = '';
  if (bt === 'idle') {
    bodySVG = `
      <g class="hero-body idle">
        <ellipse cx="50" cy="142" rx="48" ry="8" fill="#020617" opacity=".22"/>
        <path d="M29,50 C24,50 19,57 16,68 C13,79 14,90 20,92 C25,94 28,85 29,75 C30,66 34,59 39,56 C38,52 34,50 29,50 Z" fill="${skin}"/>
        <path d="M19,70 C15,78 15,88 20,92 C25,93 27,86 28,80 C25,84 21,84 20,78 C19,75 19,72 19,70 Z" fill="${skinDark}" opacity=".65"/>
        <path d="M15,81 C11,82 8,86 9,91 C10,97 16,100 22,96 C27,92 26,85 21,82 C19,81 17,80 15,81 Z" fill="${ink}"/>
        <path d="M12,87 C16,85 20,86 24,89 M13,93 C17,94 20,94 23,92" fill="none" stroke="#f8fafc" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        <path d="M16,72 C21,70 26,72 30,75 L27,84 C22,82 18,80 14,78 Z" fill="${blue}"/>
        <path d="M71,50 C76,50 81,57 84,68 C87,79 86,90 80,92 C75,94 72,85 71,75 C70,66 66,59 61,56 C62,52 66,50 71,50 Z" fill="${skin}"/>
        <path d="M81,70 C85,78 85,88 80,92 C75,93 73,86 72,80 C75,84 79,84 80,78 C81,75 81,72 81,70 Z" fill="${skinDark}" opacity=".65"/>
        <path d="M85,81 C89,82 92,86 91,91 C90,97 84,100 78,96 C73,92 74,85 79,82 C81,81 83,80 85,81 Z" fill="${ink}"/>
        <path d="M88,87 C84,85 80,86 76,89 M87,93 C83,94 80,94 77,92" fill="none" stroke="#f8fafc" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        <path d="M84,72 C79,70 74,72 70,75 L73,84 C78,82 82,80 86,78 Z" fill="${blue}"/>

        <path d="M31,40 C38,35 62,35 69,40 C74,51 70,73 61,86 C55,91 45,91 39,86 C30,72 26,52 31,40 Z" fill="${gi}"/>
        <path d="M39,39 L50,66 L61,39 C57,37 43,37 39,39 Z" fill="${blueDark}"/>
        <path d="M35,40 C41,49 45,57 50,66 C44,63 37,58 31,51 C31,46 33,42 35,40 Z" fill="#fb923c"/>
        <path d="M65,41 C62,58 58,72 50,88 C59,87 67,78 70,63 C72,52 70,45 65,41 Z" fill="${giDark}"/>
        <path d="M42,50 C45,55 47,60 50,66 M58,49 C55,56 52,62 50,67" fill="none" stroke="${giDeep}" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
        <path d="M34,79 C43,83 57,83 66,79 L64,91 C55,96 44,96 36,91 Z" fill="${blue}"/>
        <path d="M45,87 C51,89 57,88 63,84 C61,91 55,94 47,94 Z" fill="${blueDark}" opacity=".8"/>
        <path d="M55,84 C62,86 67,90 69,96 C63,96 58,93 55,88 Z" fill="${blueDark}"/>

        <path d="M36,88 C29,101 23,117 24,137 C31,142 41,140 45,134 C44,120 47,105 51,92 C46,90 41,89 36,88 Z" fill="${gi}"/>
        <path d="M27,111 C24,120 24,131 26,137 C31,140 36,139 39,135 C34,133 32,124 35,111 Z" fill="${giDark}"/>
        <path d="M39,96 C36,110 36,123 38,135 M45,102 C41,113 41,123 43,131" fill="none" stroke="${giDeep}" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
        <path d="M19,135 C27,132 38,133 46,136 L43,149 C34,153 21,151 14,147 C14,142 16,138 19,135 Z" fill="${blueDark}"/>
        <path d="M18,137 C27,137 36,138 44,141 L42,145 C32,144 23,143 15,145 Z" fill="${trim}"/>
        <path d="M14,144 C23,149 33,150 43,147" fill="none" stroke="${bootRed}" stroke-width="2.2" stroke-linecap="round"/>

        <path d="M64,88 C71,101 77,117 76,137 C69,142 59,140 55,134 C56,120 53,105 49,92 C54,90 59,89 64,88 Z" fill="${gi}"/>
        <path d="M73,111 C76,120 76,131 74,137 C69,140 64,139 61,135 C66,133 68,124 65,111 Z" fill="${giDark}"/>
        <path d="M61,96 C64,110 64,123 62,135 M55,102 C59,113 59,123 57,131" fill="none" stroke="${giDeep}" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
        <path d="M54,136 C63,132 74,132 82,136 C86,139 88,143 86,148 C77,152 65,152 57,148 Z" fill="${blueDark}"/>
        <path d="M56,140 C64,137 74,137 85,143 L84,147 C74,144 65,144 56,146 Z" fill="${trim}"/>
        <path d="M57,146 C67,150 78,150 86,147" fill="none" stroke="${bootRed}" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    `;
  } else if (pose === 'punch') {
    bodySVG = `

function makeSvgUri(svgString) {
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgString)));
}

const poses = ['idle','jab_start','jab_active','jab_recover','cross_start','cross_active','kick_start','kick_active','special_charge','special_fire','win'];
const poseMeta = {
  idle:           { power: '32%', note: 'Guarda base com respiracao e aura leve.',             aura: 'rgba(148,163,184,.18)' },
  jab_start:      { power: '50%', note: 'Ombro direito avanca, cotovelo ainda dobrado.',        aura: 'rgba(249,115,22,.22)' },
  jab_active:     { power: '62%', note: 'Jab em extensao total — janela de hit.',               aura: 'rgba(249,115,22,.3)'  },
  jab_recover:    { power: '44%', note: 'Braco direito recolhendo, guarda esquerda no lugar.',  aura: 'rgba(249,115,22,.18)' },
  cross_start:    { power: '55%', note: 'Quadril girando, braco esquerdo saindo do guard.',     aura: 'rgba(249,115,22,.24)' },
  cross_active:   { power: '68%', note: 'Cross em extensao — braco esquerdo real, sem mirror.', aura: 'rgba(249,115,22,.34)' },
  kick_start:     { power: '60%', note: 'Perna direita levantando, peso no pe esquerdo.',       aura: 'rgba(250,204,21,.28)' },
  kick_active:    { power: '74%', note: 'Chute em extensao maxima.',                            aura: 'rgba(250,204,21,.36)' },
  special_charge: { power: '86%', note: 'Maos em frente ao peito, aura pulsando.',              aura: 'rgba(96,165,250,.34)' },
  special_fire:   { power: '94%', note: 'Feixe de energia — corpo baixo e firme.',              aura: 'rgba(96,165,250,.42)' },
  win:            { power: '48%', note: 'Celebracao pos-vitoria.',                              aura: 'rgba(45,212,191,.25)' },
};
let currentLevel = 0;
let currentPose = 'idle';
let debugAnchors = false;

function toggleDebug() {
  debugAnchors = !debugAnchors;
  document.getElementById('btn-debug').classList.toggle('active', debugAnchors);
  renderHero(currentLevel);
  renderStage();
}

function renderHero(level) {
  const grid = document.getElementById('hero-grid');
  grid.innerHTML = '';
  
  poses.forEach(pose => {
    const card = document.createElement('div');
    card.className = 'card' + (pose === currentPose ? ' active' : '');
    card.onclick = () => setPose(pose);
    
    const title = document.createElement('h3');
    title.innerText = pose;
    
    const container = document.createElement('div');
    container.className = 'asset-container ' + pose;
    
    const img = document.createElement('img');
    img.src = makeSvgUri(getHeroSVG(level, pose, debugAnchors));
    img.alt = pose;
    
    container.appendChild(img);
    card.appendChild(title);
    card.appendChild(container);
    grid.appendChild(card);
  });
}

function renderStage() {
  const meta = poseMeta[currentPose];
  const stage = document.getElementById('motion-stage');
  const focus = document.getElementById('hero-focus');
  const live = document.getElementById('hero-live');

  stage.className = 'stage ' + currentPose;
  stage.style.setProperty('--aura', meta.aura);
  focus.className = 'hero-focus ' + currentPose;
  live.src = makeSvgUri(getHeroSVG(currentLevel, currentPose, debugAnchors));

  document.getElementById('stage-badge').innerText = `LEVEL ${currentLevel} / ${currentPose.toUpperCase()}`;
  document.getElementById('pose-name').innerText = currentPose.toUpperCase();
  document.getElementById('pose-note').innerText = meta.note;
  document.getElementById('power-meter').style.setProperty('--power', meta.power);

  poses.forEach(pose => {
    const btn = document.getElementById(`pose-${pose}`);
    if (btn) btn.classList.toggle('active', pose === currentPose);
  });
}

function setLevel(level) {
  currentLevel = level;
  for(let i=0; i<=3; i++){
    document.getElementById(`btn-${i}`).classList.remove('active');
  }
  document.getElementById(`btn-${level}`).classList.add('active');
  
  renderHero(level);
  renderStage();
}

function setPose(pose) {
  currentPose = pose;
  renderHero(currentLevel);
  renderStage();
}

function renderEnemies() {
  const grid = document.getElementById('enemy-grid');
  
  const enemies = [
    { name: 'Minion', svg: svgMinion },
    { name: 'Boss Idle', svg: svgBossIdle, large: true },
    { name: 'Boss Hit', svg: svgBossHit, large: true }
  ];
  
  enemies.forEach(enemy => {
    const card = document.createElement('div');
    card.className = 'card';
    
    const title = document.createElement('h3');
    title.innerText = enemy.name;
    
    const container = document.createElement('div');
    container.className = 'asset-container' + (enemy.large ? ' large' : '');
    
    const img = document.createElement('img');
    img.src = makeSvgUri(enemy.svg);
    
    container.appendChild(img);
    card.appendChild(title);
    card.appendChild(container);
    grid.appendChild(card);
  });
}

// Init
setLevel(currentLevel);
setPose(currentPose);
renderEnemies();

</script>
